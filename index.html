<title>Flappy Face Race</title>
<style>
html,body{margin:0;height:100%;background:#70c5ce;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#ov.bottom{align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.panel{background:#fff8d6;border:4px solid #33620f;border-radius:18px;padding:16px 18px;width:min(86vw,320px);box-shadow:0 8px 0 rgba(0,0,0,.18);text-align:center;color:#2a4a0e;pointer-events:auto;max-height:86vh;overflow:auto}
.panel h1{margin:0 0 8px;font-size:30px;font-weight:900;letter-spacing:1px}
.panel h2{margin:0 0 4px;font-size:24px;font-weight:900}
.panel p{margin:6px 0;font-size:14px;color:#6b5516}
button{font:900 18px system-ui,sans-serif;border:3px solid #33620f;background:#8fdc43;color:#1f3a08;border-radius:12px;padding:11px 14px;width:100%;margin:6px 0;box-shadow:0 4px 0 #33620f;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #33620f}
button.alt{background:#fff}
button:disabled{opacity:.45}
input{font:700 16px system-ui,sans-serif;border:3px solid #33620f;border-radius:12px;padding:10px;width:100%;box-sizing:border-box;margin:4px 0;background:#fff;color:#2a4a0e;text-align:center;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1;min-width:0;text-transform:uppercase}.row button{width:auto;flex:0 0 auto}
.sep{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#7a5b1a;margin:10px 0 2px}
.code{font:900 44px ui-monospace,Menlo,monospace;letter-spacing:8px;background:#fff;border:3px dashed #33620f;border-radius:12px;padding:4px 0 4px 8px;margin:4px 0}
ul{list-style:none;margin:8px 0;padding:0;text-align:left}
li{display:flex;align-items:center;gap:8px;padding:5px 4px;font-weight:800;border-bottom:1px solid #e6d9a0}
li b{margin-left:auto;font-weight:900}
li em{font-style:normal;font-size:12px;color:#4c9a1c;font-weight:800}
.msg{min-height:18px;color:#b3261e!important;font-weight:700}
.birds{display:flex;gap:6px;justify-content:center;margin:6px 0}
.bp{width:54px;height:54px;border-radius:50%;padding:0;border:3px solid #33620f;background:#bfe9ff;overflow:hidden;box-shadow:none;margin:0;flex:0 0 54px}
.bp.sel{border-color:#ffb300;box-shadow:0 0 0 3px #ffb300}
.bp img{width:100%;height:100%;object-fit:cover;object-position:center 30%;display:block;pointer-events:none}
li img{width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:center 30%;flex:0 0 26px;border:3px solid #999;box-sizing:border-box}
.small{font-size:12px;font-weight:800;color:#7a5b1a;text-align:left;margin:6px 0 0}
#mb{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:auto;padding:6px 12px;font-size:16px;margin:0;display:none}

const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,S,SAT=0;const BASE_W=360,BASE_H=640;
const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none';document.body.appendChild(probe);
function resize(){const d=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;S=Math.min(W/BASE_W,H/BASE_H);SAT=probe.offsetHeight;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();

// ---------- audio ----------
let AC,tapBuf,failBuf,failSrc;
const tapEl=new Audio(TAP),failEl=new Audio(FAIL);
function b64buf(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
 AC.decodeAudioData(b64buf(TAP),b=>tapBuf=b,()=>{});AC.decodeAudioData(b64buf(FAIL),b=>failBuf=b,()=>{});}catch(e){AC=null}}
function playTap(){if(AC&&tapBuf){AC.resume();const s=AC.createBufferSource();s.buffer=tapBuf;s.connect(AC.destination);s.start()}else{tapEl.currentTime=0;tapEl.play().catch(()=>{})}}
function playFail(){stopFail();if(AC&&failBuf){AC.resume();failSrc=AC.createBufferSource();failSrc.buffer=failBuf;failSrc.connect(AC.destination);failSrc.start()}else{failEl.currentTime=0;failEl.play().catch(()=>{})}}
function stopFail(){try{if(failSrc)failSrc.stop()}catch(e){}failSrc=null;failEl.pause()}
addEventListener('pointerdown',initAudio);

// ---------- assets ----------
const ld=u=>{const i=new Image();i.src=u;return i};const birdImg=BF.map(ld),failImg=BX.map(ld);
let myBird=0;try{myBird=Math.min(3,Math.max(0,+localStorage.getItem("ffbird")||0))}catch(e){}

// ---------- game state ----------
const G=0.5,FLAP=-7.6,MAXFALL=10,SPEED=2.4,GAP=165,PW=62,GROUND=90,SPACING=200;
let mode='menu';              // menu | solo | mp
let state='ready';            // ready | wait | count | play | dead
let bird,pipes,score,best=0,frame=0,shake=0,deadT=0,won=false,myD=0,clouds=[];
let rng=Math.random;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
try{best=+localStorage.getItem('ffbest')||0}catch(e){}
for(let i=0;i<6;i++)clouds.push({x:Math.random()*BASE_W*1.4,y:30+Math.random()*180,s:.6+Math.random()*.9});
const CENTER=BASE_H/2-GROUND/2;
function reset(){bird={x:96,y:CENTER,vy:0,r:0};pipes=[];score=0;frame=0;won=false;myD=0;pipes.push(newPipe(BASE_W+80))}
function newPipe(x){const m=70,top=m+rng()*(BASE_H-GROUND-GAP-m*2);return{x,top,passed:false}}
reset();

// ---------- multiplayer ----------
let db=null,off=0,mp=null,ghosts={};
const myId=Math.random().toString(36).slice(2,8);
let myName='Player';try{myName=localStorage.getItem('ffname')||'Player'}catch(e){}
const now=()=>Date.now()+off;
const TS=()=>firebase.database.ServerValue.TIMESTAMP;
const mpAvailable=()=>typeof firebase!=='undefined'&&CFG.databaseURL&&!/PASTE/.test(CFG.databaseURL);
function initDB(){if(db)return true;try{firebase.initializeApp(CFG);db=firebase.database();db.ref('.info/serverTimeOffset').on('value',s=>off=s.val()||0);return true}catch(e){console.error(e);return false}}
const hue=id=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return h};
const color=id=>`hsl(${hue(id)},85%,55%)`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ';
const randCode=()=>Array.from({length:4},()=>CODE_CH[Math.random()*CODE_CH.length|0]).join('');

const ov=document.getElementById('ov'),mb=document.getElementById('mb');
function panel(html,bottom){ov.className=bottom?'bottom':'';ov.innerHTML='<div class="ui panel">'+html+'</div>'}
function hidePanel(){ov.innerHTML=''}
function setMsg(t){const m=document.getElementById('msg');if(m)m.textContent=t||''}
function readName(){const n=document.getElementById('nm');if(n){myName=(n.value.trim()||'Player').slice(0,12);try{localStorage.setItem('ffname',myName)}catch(e){}}}

const picker=()=>'<div class="birds">'+BF.map((u,i)=>`<button class="bp${i===myBird?' sel':''}" data-act="bird" data-i="${i}" aria-label="Bird ${i+1}"><img src="${u}" alt=""></button>`).join('')+'</div>';
function showMenu(note){
 const ok=mpAvailable();
 panel(`<h1>FLAPPY FACE</h1>
 <div class="small">Your name</div>
 <input id="nm" maxlength="12" placeholder="Your name" value="${esc(myName)}">
 <div class="small">Pick your bird</div>${picker()}
 <button data-act="solo">Play solo</button>
 <div class="sep">Multiplayer race</div>
 <button data-act="create" ${ok?'':'disabled'}>Create room</button>
 <div class="row"><input id="cd" maxlength="4" placeholder="CODE" autocapitalize="characters" autocomplete="off" ${ok?'':'disabled'}><button data-act="join" ${ok?'':'disabled'}>Join</button></div>
 <p class="msg" id="msg">${note?esc(note):''}</p>
 ${ok?'':'<p>Multiplayer is not set up yet. Add your Firebase details at the top of this file.</p>'}`);
}
const rowIcon=(id,p)=>`<img src="${BF[p.b||0]}" style="border-color:${color(id)}" alt="">`;
function lobbyList(){
 return Object.keys(mp.players).sort().map(id=>{const p=mp.players[id];return `<li>${rowIcon(id,p)}${esc(p.n||'Player')}${id===myId?' (you)':''}${id===mp.host?' 👑':''}</li>`}).join('');
}
const hostBtn=()=>mp.host===myId?'<button data-act="start">Start race</button>':'<p>Waiting for the host to start…</p>';
function showLobby(){
 if(!mp)return;
 panel(`<div class="sep">Room code</div><div class="code">${mp.code}</div>
 <p>Friends join with this code</p>
 <div class="small">Name</div>
 <div class="row"><input id="nm2" maxlength="12" value="${esc(myName)}" style="text-transform:none"><button data-act="rename">Save</button></div>
 <div class="small">Bird</div>${picker()}
 <ul id="pl">${lobbyList()}</ul><div id="hb">${hostBtn()}</div>
 <button class="alt" data-act="leave">Leave</button>`);
}
function updateLobby(){const pl=document.getElementById('pl');if(!pl)return showLobby();pl.innerHTML=lobbyList();document.getElementById('hb').innerHTML=hostBtn()}
function showResults(){
 if(!mp)return;
 const ps=Object.entries(mp.players).map(([id,p])=>({id,...p}));
 ps.sort((a,b)=>((b.a?1:0)-(a.a?1:0))||((b.t||0)-(a.t||0)));
 const over=ps.length>0&&ps.every(p=>!p.a);
 const list=ps.map((p,i)=>`<li>${rowIcon(p.id,p)}${i+1}. ${esc(p.n||'Player')}${p.id===myId?' (you)':''}${p.a?' <em>flying</em>':''}<b>${p.s||0}</b></li>`).join('');
 const host=mp.host===myId;
 panel(`<h2>${won?'🏆 You win!':"You're out!"}</h2>
 <p>${over?esc(ps[0].n||'Player')+' wins the race':'Waiting for the others…'}</p><ul>${list}</ul>
 ${over?(host?'<button data-act="again">Play again</button>':'<p>Waiting for the host…</p>'):''}
 <button class="alt" data-act="leave">Leave</button>`,true);
}
function refreshUI(){if(!mp)return;if(mp.status==='lobby')updateLobby();else if(state==='dead')showResults()}

async function createRoom(){
 readName();if(!initDB())return setMsg('Could not start multiplayer.');
 try{for(let i=0;i<6;i++){const code=randCode();const ref=db.ref('rooms/'+code+'/meta');const s=await ref.once('value');
  if(!s.val()){await ref.set({host:myId,status:'lobby',seed:1,startAt:0,round:0});enterRoom(code);return}}
  setMsg('Try again.')}catch(e){console.error(e);setMsg('Database error. Check your Firebase URL and rules.')}
}
async function joinRoom(){
 readName();const code=(document.getElementById('cd').value||'').trim().toUpperCase();
 if(code.length!==4)return setMsg('Enter the 4-letter code.');
 if(!initDB())return setMsg('Could not start multiplayer.');
 try{const s=await db.ref('rooms/'+code+'/meta').once('value');const m=s.val();
  if(!m)return setMsg('Room not found.');
  if(m.status!=='lobby')return setMsg('That race already started.');
  enterRoom(code)}catch(e){console.error(e);setMsg('Database error. Check your Firebase URL and rules.')}
}
function enterRoom(code){
 const r=db.ref('rooms/'+code);
 mp={code,r,me:r.child('players/'+myId),status:'lobby',players:{},host:null,round:0,lastRound:0,startAt:0};
 mode='mp';state='wait';rng=Math.random;reset();ghosts={};
 mp.me.onDisconnect().remove();
 mp.me.set({n:myName,b:myBird,a:true,s:0,y:CENTER,r:0,t:0,d:0});
 r.child('players').on('value',s=>{if(mp&&mp.r===r){mp.players=s.val()||{};onPlayers()}});
 r.child('meta').on('value',s=>{if(mp&&mp.r===r)onMeta(s.val())});
 showLobby();
}
function onPlayers(){
 const seen={};
 for(const id in mp.players){if(id===myId)continue;const p=mp.players[id];seen[id]=1;
  const g=ghosts[id]||(ghosts[id]={y:p.y,r:p.r,dd:p.d||0});g.ty=p.y;g.tr=p.r;g.a=p.a;g.n=p.n;g.s=p.s;g.b=p.b||0;g.d=p.d||0}
 for(const id in ghosts)if(!seen[id])delete ghosts[id];
 if(mp.host&&!mp.players[mp.host]){const ids=Object.keys(mp.players).sort();if(ids[0]===myId)mp.r.child('meta/host').set(myId)}
 refreshUI();
}
function onMeta(m){
 if(!m){leaveToMenu('The room was closed.');return}
 mp.host=m.host;mp.round=m.round;mp.startAt=m.startAt;
 if(m.status==='playing'&&m.round!==mp.lastRound)startRound(m);
 else if(m.status==='lobby'&&mp.status!=='lobby')toLobby();
 else refreshUI();
}
function startRound(m){
 mp.lastRound=m.round;mp.status='playing';rng=mulberry32(m.seed);reset();state='count';
 for(const id in ghosts){ghosts[id].y=ghosts[id].ty=CENTER;ghosts[id].r=ghosts[id].tr=0;ghosts[id].a=true;ghosts[id].d=ghosts[id].dd=0}
 mp.me.update({a:true,s:0,y:CENTER,r:0,t:0,d:0});hidePanel();
}
function toLobby(){
 mp.status='lobby';rng=Math.random;reset();state='wait';
 mp.me.update({a:true,s:0,y:CENTER,r:0,t:0,d:0});showLobby();
}
function startRace(){db.ref('rooms/'+mp.code+'/meta').update({status:'playing',seed:(Math.random()*1e9)|0,startAt:now()+3000,round:mp.round+1})}
function playAgain(){db.ref('rooms/'+mp.code+'/meta').update({status:'lobby'})}
function leaveRoom(){
 if(!mp)return;const m=mp;mp=null;ghosts={};
 try{m.r.child('players').off();m.r.child('meta').off();m.me.onDisconnect().cancel();
  const alone=Object.keys(m.players).filter(id=>id!==myId).length===0;
  m.me.remove();if(alone)m.r.remove()}catch(e){}
}
function leaveToMenu(note){leaveRoom();stopFail();mode='menu';state='ready';rng=Math.random;reset();showMenu(note)}

function chooseBird(i){myBird=i;try{localStorage.setItem('ffbird',i)}catch(e){}
 document.querySelectorAll('.bp').forEach(b=>b.classList.toggle('sel',+b.dataset.i===i));
 if(mp)mp.me.update({b:i})}
function rename(){const n=document.getElementById('nm2');if(!n)return;myName=(n.value.trim()||'Player').slice(0,12);n.value=myName;try{localStorage.setItem('ffname',myName)}catch(e){}if(mp)mp.me.update({n:myName})}
function act(a,el){
 if(a==='bird')return chooseBird(+el.dataset.i);
 if(a==='rename')return rename();
 if(a==='solo'){readName();mode='solo';state='ready';rng=Math.random;reset();hidePanel()}
 else if(a==='create')createRoom();
 else if(a==='join')joinRoom();
 else if(a==='start')startRace();
 else if(a==='again')playAgain();
 else if(a==='leave')leaveToMenu();
}
ov.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b)});
mb.addEventListener('click',()=>leaveToMenu());

// ---------- input ----------
function flap(){bird.vy=FLAP;playTap()}
function press(e){
 if(e.target&&e.target.closest&&e.target.closest('.ui,#mb'))return;
 if(e.preventDefault)e.preventDefault();initAudio();
 if(mode==='solo'){
  if(state==='ready'){state='play';flap()}
  else if(state==='play')flap();
  else if(state==='dead'&&deadT>35){stopFail();reset();state='ready'}
 }else if(mode==='mp'&&state==='play')flap();
}
addEventListener('pointerdown',press,{passive:false});
addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||''))return;if(e.code==='Space'||e.code==='ArrowUp')press(e)});

function finish(win){
 state='dead';deadT=0;won=win;
 if(!win){shake=10;playFail()}
 if(mode==='solo'){if(score>best){best=score;try{localStorage.setItem('ffbest',best)}catch(e){}}}
 else if(mp){mp.me.update({a:false,s:score,y:Math.round(bird.y),d:Math.round(myD),t:TS()});showResults()}
}
const die=()=>finish(false);

function update(){
 frame++;
 clouds.forEach(c=>{c.x-=.15*c.s;if(c.x<-80)c.x=BASE_W+80});
 for(const id in ghosts){const g=ghosts[id];if(g.ty!=null){g.y+=(g.ty-g.y)*.35;g.r+=(g.tr-g.r)*.35}g.dd+=((g.d||0)-g.dd)*.35}
 if(state==='ready'||state==='wait'||state==='count'){
  bird.y=CENTER+Math.sin(frame/12)*8;bird.r=0;
  if(state==='count'&&now()>=mp.startAt){state='play';frame=0;bird.vy=FLAP}
  return}
 if(state==='dead'){deadT++;
  if(won){bird.y=CENTER+Math.sin(frame/12)*8;bird.r=0;return}
  if(bird.y<BASE_H-GROUND-22){bird.vy=Math.min(bird.vy+G,MAXFALL);bird.y+=bird.vy;bird.r=Math.min(bird.r+.08,1.4)}else bird.y=BASE_H-GROUND-22;
  if(shake>0)shake--;return}
 bird.vy=Math.min(bird.vy+G,MAXFALL);bird.y+=bird.vy;bird.r=Math.max(-.45,Math.min(1.2,bird.vy*.07));
 pipes.forEach(p=>p.x-=SPEED);myD=frame*SPEED;
 if(pipes[pipes.length-1].x<BASE_W-SPACING+PW)pipes.push(newPipe(BASE_W+10));
 if(pipes[0].x<-PW-10)pipes.shift();
 const R=17;
 for(const p of pipes){
  if(!p.passed&&p.x+PW<bird.x-R){p.passed=true;score++}
  if(bird.x+R-4>p.x&&bird.x-R+4<p.x+PW&&(bird.y-R+4<p.top||bird.y+R-4>p.top+GAP))return die();
 }
 if(bird.y+R>BASE_H-GROUND||bird.y-R<-40){bird.y=Math.min(bird.y,BASE_H-GROUND-R);return die()}
 if(mode==='mp'&&mp){
  if(frame%3===0)mp.me.update({y:Math.round(bird.y*10)/10,r:Math.round(bird.r*100)/100,s:score,d:Math.round(myD)});
  const gs=Object.values(ghosts);
  if(frame>90&&gs.length>0&&gs.every(g=>!g.a))finish(true);
 }
}

// ---------- drawing ----------
function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();
 [[0,0,22],[24,-8,28],[52,0,22],[26,6,24]].forEach(([dx,dy,r])=>{ctx.moveTo(x+dx*s+r*s,y+dy*s);ctx.arc(x+dx*s,y+dy*s,r*s,0,7)});ctx.fill()}
function pipe(x,top){
 const bot=top+GAP,capH=26,capX=x-4,capW=PW+8,hy=BASE_H-GROUND;
 function body(y1,y2){const g=ctx.createLinearGradient(x,0,x+PW,0);g.addColorStop(0,'#6fbf2f');g.addColorStop(.35,'#a6e65a');g.addColorStop(1,'#4c9a1c');ctx.fillStyle=g;ctx.fillRect(x,y1,PW,y2-y1);ctx.strokeStyle='#33620f';ctx.lineWidth=2.5;ctx.strokeRect(x,y1,PW,y2-y1)}
 function cap(y){const g=ctx.createLinearGradient(capX,0,capX+capW,0);g.addColorStop(0,'#6fbf2f');g.addColorStop(.35,'#a6e65a');g.addColorStop(1,'#4c9a1c');ctx.fillStyle=g;ctx.fillRect(capX,y,capW,capH);ctx.strokeStyle='#33620f';ctx.lineWidth=2.5;ctx.strokeRect(capX,y,capW,capH)}
 body(-5,top-capH);cap(top-capH);body(bot+capH,hy+5);cap(bot);
}
function drawFace(img,y,r,alpha,ring){
 if(!(img.complete&&img.naturalWidth))return;const h=54,w=h*img.naturalWidth/img.naturalHeight;
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(bird.x,y);ctx.rotate(r);
 if(ring){ctx.strokeStyle=ring;ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(0,0,w/2+2,h/2+2,0,0,7);ctx.stroke()}
 else{ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=6;ctx.shadowOffsetY=3}
 ctx.drawImage(img,-w/2,-h/2,w,h);ctx.restore();
}
function draw(){
 ctx.save();ctx.clearRect(0,0,W,H);
 const ox=(W-BASE_W*S)/2,oy=(H-BASE_H*S)/2;
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#4fb3f0');g.addColorStop(.7,'#bfe9ff');g.addColorStop(1,'#e6f7ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,236,150,.35)';ctx.beginPath();ctx.arc(W*.8,H*.12,52*S,0,7);ctx.fill();
 ctx.fillStyle='#ffe66b';ctx.beginPath();ctx.arc(W*.8,H*.12,32*S,0,7);ctx.fill();
 ctx.translate(ox,oy);ctx.scale(S,S);
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 clouds.forEach(c=>cloud(c.x,c.y,c.s));
 const gy=BASE_H-GROUND;
 ctx.fillStyle='#9fdc8a';ctx.beginPath();ctx.moveTo(-200,gy);for(let x=-200;x<=BASE_W+200;x+=10)ctx.lineTo(x,gy-50-Math.sin((x+frame*.2)/55)*18);ctx.lineTo(BASE_W+200,gy);ctx.fill();
 ctx.fillStyle='#7ccf6a';ctx.beginPath();ctx.moveTo(-200,gy);for(let x=-200;x<=BASE_W+200;x+=10)ctx.lineTo(x,gy-22-Math.sin((x+frame*.6)/32+2)*12);ctx.lineTo(BASE_W+200,gy);ctx.fill();
 pipes.forEach(p=>pipe(p.x,p.top));
 const off2=(state==='dead'?0:frame*SPEED)%24;
 ctx.fillStyle='#ded895';ctx.fillRect(-300,gy,BASE_W+600,GROUND+400);
 ctx.fillStyle='#73bf2e';ctx.fillRect(-300,gy,BASE_W+600,16);
 ctx.fillStyle='#8fdc43';for(let x=-24-off2;x<BASE_W+300;x+=24){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+12,gy);ctx.lineTo(x+24,gy+16);ctx.lineTo(x+12,gy+16);ctx.fill()}
 ctx.fillStyle='#33620f';ctx.fillRect(-300,gy+16,BASE_W+600,3);
 ctx.fillStyle='#c9bf75';for(let x=-off2;x<BASE_W+300;x+=40)ctx.fillRect(x,gy+40,18,4);
 // other players (ghosts)
 if(mode==='mp'&&(state==='play'||state==='count'||state==='dead')){
  for(const id in ghosts){const gh=ghosts[id];if(!gh.a)continue;
   drawFace(birdImg[gh.b||0],gh.y,gh.r,.55,color(id));
   ctx.save();ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.55)';ctx.fillStyle='#fff';
   ctx.strokeText(gh.n||'',bird.x,gh.y-38);ctx.fillText(gh.n||'',bird.x,gh.y-38);ctx.restore()}
 }
 // my bird
 if(mode!=='menu'){const sp=(state==='dead'&&!won&&failImg[myBird].naturalWidth)?failImg[myBird]:birdImg[myBird];drawFace(sp,bird.y,bird.r,1,null)}
 ctx.restore();
 // HUD
 ctx.save();ctx.translate(W/2,0);ctx.scale(S,S);ctx.textAlign='center';ctx.lineJoin='round';
 const T=(t,y,sz,sw=6)=>{ctx.font=`900 ${sz}px "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif`;ctx.lineWidth=sw;ctx.strokeStyle='#2a4a0e';ctx.strokeText(t,0,y);ctx.fillStyle='#fff';ctx.fillText(t,0,y)};
 if(mode==='mp'&&(state==='play'||state==='count'||state==='dead'))drawBar(T);
 if(state==='play'){T(score,mode==='mp'?132:110,56,8);
  if(mode==='mp'){const gs=Object.values(ghosts);if(gs.length)T('Alive '+(1+gs.filter(x=>x.a).length)+'/'+(1+gs.length),158,20,5)}}
 if(state==='ready'&&mode==='solo'){T('FLAPPY FACE',170,44,8);T('Tap to flap',BASE_H/2+90,26,5)}
 if(state==='count'&&mp){T(Math.min(3,Math.max(1,Math.ceil((mp.startAt-now())/1000))),BASE_H/2-60,110,10)}
 if(state==='dead'&&mode==='solo'){const y0=(H/S-BASE_H)/2;
  T('Game over',y0+190,44,8);
  ctx.fillStyle='#fff8d6';ctx.strokeStyle='#33620f';ctx.lineWidth=4;
  const x=-110,y=y0+225,w=220,h=110,r=14;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();ctx.stroke();
  ctx.fillStyle='#7a5b1a';ctx.font='700 18px system-ui,sans-serif';ctx.fillText('Score',-55,y+34);ctx.fillText('Best',55,y+34);
  ctx.fillStyle='#2a4a0e';ctx.font='900 40px system-ui,sans-serif';ctx.fillText(score,-55,y+82);ctx.fillText(best,55,y+82);
  if(deadT>35)T('Tap to retry',y0+400,26,5)}
 ctx.restore();
 const showMb=(mode==='solo'&&state!=='play')?'block':'none';
 if(mb.style.display!==showMb)mb.style.display=showMb;
}
function drawBar(T){
 const items=[{id:myId,d:myD,a:state==='play'||state==='count',b:myBird,me:true}];
 for(const id in ghosts){const g=ghosts[id];items.push({id,d:g.dd,a:g.a,b:g.b||0})}
 const lane={};items.map(i=>i.id).sort().forEach((id,k)=>lane[id]=k%3);
 const maxD=Math.max(3700,...items.map(i=>i.d)),by=SAT/S+42,x0=-135,len=270;
 ctx.save();ctx.lineWidth=2.5;ctx.strokeStyle='#2a4a0e';ctx.fillStyle='rgba(255,255,255,.95)';
 ctx.beginPath();ctx.roundRect(x0-6,by-4,len+12,8,4);ctx.fill();ctx.stroke();
 ctx.font='16px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('🏁',x0+len+24,by+6);
 items.sort((a,b)=>(a.me?1:0)-(b.me?1:0)||(a.a?1:0)-(b.a?1:0));
 for(const it of items){
  const x=x0+Math.min(1,it.d/maxD)*len,y=by+(lane[it.id]-1)*9,r=it.me?13:11,img=birdImg[it.b];
  ctx.save();ctx.globalAlpha=it.a?1:.45;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.save();ctx.clip();ctx.fillStyle='#bfe9ff';ctx.fillRect(x-r,y-r,2*r,2*r);
  if(img.naturalWidth){const k=2*r/Math.min(img.naturalWidth,img.naturalHeight);const w=img.naturalWidth*k,h=img.naturalHeight*k;ctx.drawImage(img,x-w/2,y-h/2+r*.15,w,h)}
  ctx.restore();ctx.lineWidth=it.me?3.5:3;ctx.strokeStyle=it.me?'#ffb300':color(it.id);ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
  ctx.restore();
 }
 ctx.restore();
}
let last=0,acc=0;const STEP=1000/60;
(function loop(ts){if(!last)last=ts||0;acc+=Math.min(100,(ts||0)-last);last=ts||0;
 while(acc>=STEP){update();acc-=STEP}draw();requestAnimationFrame(loop)})();
showMenu();
</script></body></html>
